[workspace]
authors = [
    "Neclow <neil.clow@sund.ku.dk>",
    "Harrison Bo Hua Zhu <harrison.zhu@sund.ku.dk>",
    "David Duchêne <david.duchene@sund.ku.dk>",
]
channels = ["conda-forge", "bioconda"]
name = "phylaudio"
platforms = ["linux-64"]
version = "0.1.1"

[system-requirements]
cuda = "12"

[activation]
scripts = ["scripts/activate.sh"]

[tasks]
post_install = "bash scripts/post_install.sh"
download_fleurs = "python -m pipeline.download_fleurs fleurs-r"
download_glottolog = "python -m pipeline.download_glottolog fleurs-r"
download_phoible = "python -m pipeline.download_phoible fleurs-r"
download_models = "python -m pipeline.download_models data/models"
download_reference_trees = "python -m pipeline.download_reference_trees fleurs-r --preserve-branch-length"
download_speakerpop = "python -m pipeline.download_speakerpop fleurs-r"
download_geojson = "python -m pipeline.download_geojson"
download_fleurs_metadata = "python -m pipeline.download_fleurs_metadata fleurs-r"
beast_generate_xml = "python -m pipeline.beast_generate_xml"
beazt = "bash pipeline/run_beast.sh"
beazt_ns = "bash pipeline/run_beast_ns.sh"
beazt_combine = "bash pipeline/run_beast_combine.sh"
extract_embeddings = "python -m pipeline.extract_embeddings"
lid = "python -m pipeline.language_identification"
lid_summary = "python -m pipeline.language_identification_summary"
network_analysis = "python -m pipeline.network_analysis"
bootstrap_delta = "Rscript pipeline/bootstrap_delta.R"
nmf_brms = "Rscript pipeline/nmf_brms.R"
nmf_structure = "Rscript pipeline/nmf_structure.R"
sentence_discrete = "python -m pipeline.sentence_trees_discrete"
sentence_distance = "python -m pipeline.sentence_trees_distance"
sentence_astral = "bash pipeline/sentence_trees_astral.sh"
sentence_summary = "python -m pipeline.sentence_trees_summary"
sentence_stats = "Rscript pipeline/sentence_trees_stats.R"
sentence_postprocess = "bash pipeline/sentence_trees_postprocess.sh"
squim = "python -m pipeline.squim"

[tasks.beast2]
cmd = "extern/beast2/bin/beast"

[tasks.loganalyser]
cmd = "extern/beast2/bin/loganalyser"

[tasks.logcombiner]
cmd = "extern/beast2/bin/logcombiner"

[tasks.packagemanager]
cmd = "extern/beast2/bin/packagemanager"

[tasks.treeannotator]
cmd = "extern/beast2/bin/treeannotator"

[tasks.splitstree]
cmd = "extern/splitstree/SplitsTree"

[dependencies]
# Python deps
python = "3.10.12.*"
pandas = ">=2.3.2,<3"
requests = ">=2.32.5,<3"
tqdm = ">=4.67.1,<5"
rpy2 = ">=3.6.2,<4"
scipy = ">=1.15.2,<2"
regex = ">=2025.7.34,<2026"
biopython = ">=1.85,<2"
r-dplyr = ">=1.1.4,<2"
r-base = ">=4.4.3,<4.5"
r-ape = ">=5.8,<6"
r-tibble = ">=3.2.1,<4"
r-doparallel = ">=1.0.17,<2"
r-tidyr = ">=1.3.1,<2"
bioconductor-lea = { version = ">=3.18.0,<4", channel = "bioconda" }
# Deep learning
pytorch = ">=2.7.1,<2.8"
torchaudio = ">=2.7.1,<2.9"
huggingface_hub = ">=0.34.4,<0.35"
torchinfo = ">=1.8.0,<2"
torchmetrics = ">=1.8.1,<2"
datasets = "==3.2.0"
transformers = "==4.45.2"
lightning = ">=2.5.4,<3"
# Phylogenetics
ete3 = ">=3.1.3,<4"
dendropy = ">=5.0,<6"
iqtree = ">=3.0.1,<4"
aster = { version = ">=1.23,<2", channel = "bioconda" }
r-phangorn = ">=2.12.1,<3"
r-treedist = ">=2.11.1,<3"
# Dev tools
black = ">=25.1.0,<26"
uv = ">=0.8.13,<0.9"
pre-commit = ">=4.5.0,<5"
pylint = ">=4.0.5,<5"
spacy = ">=3.8.14,<4"

[pypi-dependencies]
pyglottolog = ">=3.16.0, <4"
nemo-toolkit = { version = ">=2.0.0, <3", extras = ["asr"] }
opensmile = ">=2.6.0, <3"
speechbrain = ">=1.0.3, <2"
openai-whisper = ">=20250625, <20250626"
torch-pca = ">=1.1.0, <2"
rapidfuzz = "==3.14.1"
pypdf = ">=6.5.0, <7"
# espnet = ">=202205, <202208"

[environments]
default = { solve-group = "default" }
regression = { features = [
    "regression",
], solve-group = "regression", no-default-feature = true }
gp = { features = ["gp"], solve-group = "gp", no-default-feature = true }
viz = { features = ["viz"], solve-group = "viz" }

[feature.regression.dependencies]
python = "3.10.12.*"
pandas = ">=2.3.2,<3"
r-base = ">=4.5,<4.6"
r-ape = ">=5.8,<6"
r-dplyr = ">=1.1.4,<2"
r-tibble = ">=3.2.1,<4"
r-tidyr = ">=1.3.1,<2"
r-doparallel = ">=1.0.17,<2"
r-treedist = ">=2.11.1,<3"
r-bh = ">=1.75.0"
r-brms = ">=2.23.0,<3"
r-cmdstanr = ">=0.9.0,<1"

[feature.regression.tasks]
prepare_regression_data = "python -m pipeline.prepare_regression_data"
beast_phylolm = "Rscript pipeline/beast_phylolm.R"

[feature.gp.dependencies]
python = "3.10.12.*"
pandas = ">=2.3.2,<3"
tqdm = ">=4.67.1,<5"
setuptools = ">=80,<81"
geopandas = ">=1.0,<2"
gpflow = ">=2.9,<3"
tensorflow = ">=2.16,<3"
tf-keras = ">=2.16,<3"
scikit-learn = ">=1.5,<2"

[feature.gp.tasks]
fit_gp_surface = "python -m pipeline.fit_gp_surface"

[feature.viz.dependencies]
python = "3.10.12.*"
plotly = ">=6.5.0,<7"
seaborn = ">=0.13.2,<0.14"
bioconductor-ggtree = { version = ">=4.0.4,<5", channel = "bioconda" }
scipy = ">=1.15.2,<2"
geopandas = ">=1.0,<2"
dendropy = ">=5.0,<6"
matplotlib-base = ">=3.9,<4"

[feature.viz.tasks]
fig1_acc_vs_brsupport = "python -m plots.fig1_acc_vs_brsupport"
fig1_nmf = "python -m plots.fig1_nmf"
fig1_delta = "python -m plots.fig1_delta"
fig1_pca = "python -m plots.fig1_pca"
fig1_pca_plotly = "python -m plots.fig1_pca_plotly"
fig1_sqa = "python -m plots.fig1_sqa"
fig2_root_age = "python -m plots.fig2_root_age"
fig2_rates = "python -m plots.fig2_rates"
fig3_geo = "python -m plots.fig3_geo"
